services:
  geoapify_importer.client:
    class: Drupal\geoapify_importer\Service\GeoapifyClient
    arguments: ['@http_client', '@logger.channel.geoapify_importer', '@state', '@geoapify_importer.rate_limiter']

  geoapify_importer.source_writer:
    class: Drupal\geoapify_importer\Service\SourceFileWriter
    arguments: ['@file_system', '@logger.channel.geoapify_importer']

  geoapify_importer.address_verifier:
    class: Drupal\geoapify_importer\Service\AddressVerifier
    arguments: ['@geoapify_importer.client', '@config.factory', '@logger.channel.geoapify_importer']

  geoapify_importer.poi_category_classifier:
    class: Drupal\geoapify_importer\Service\Poi\PoiCategoryClassifier

  geoapify_importer.change_detector:
    class: Drupal\geoapify_importer\Service\ChangeDetector

  geoapify_importer.place_identity:
   class: Drupal\geoapify_importer\Service\PlaceIdentity

  geoapify_importer.town_boundary_resolver:
    class: Drupal\geoapify_importer\Service\TownBoundaryResolver
    arguments: ['@geoapify_importer.client', '@file_system', '@logger.channel.geoapify_importer']

  geoapify_importer.coordinate_transformer:
    class: Drupal\geoapify_importer\Service\CoordinateTransformer

  geoapify_importer.town_import_runner:
    class: Drupal\geoapify_importer\Service\TownImportRunner
    arguments: ['@geoapify_importer.client', '@geoapify_importer.source_writer', '@geoapify_importer.change_detector', '@geoapify_importer.place_identity', '@geoapify_importer.poi_category_classifier', '@geoapify_importer.town_boundary_resolver', '@entity_type.manager', '@logger.channel.geoapify_importer']

  geoapify_importer.poi_category_mapper:
    class: Drupal\geoapify_importer\Service\Poi\PoiCategoryMapper
    arguments: ['@entity_type.manager', '@logger.channel.geoapify_importer']

  geoapify_importer.poi_node_creator:
    class: Drupal\geoapify_importer\Service\Poi\PoiNodeCreator
    arguments: ['@entity_type.manager', '@geoapify_importer.coordinate_transformer', '@geoapify_importer.address_verifier', '@logger.channel.geoapify_importer']

  geoapify_importer.poi_import_processor:
    class: Drupal\geoapify_importer\Service\Poi\PoiImportProcessor
    arguments: ['@geoapify_importer.poi_category_mapper', '@geoapify_importer.poi_node_creator', '@geoapify_importer.poi_node_updater', '@geoapify_importer.place_info', '@logger.channel.geoapify_importer']

  geoapify_importer.rate_limiter:
    class: Drupal\geoapify_importer\Service\GeoapifyRateLimiter
    arguments: ['@state', '@config.factory']

  geoapify_importer.place_details:
    class: Drupal\geoapify_importer\Service\PlaceDetails
    arguments: ['@geoapify_importer.client', '@config.factory', '@logger.channel.geoapify_importer']

  geoapify_importer.poi_node_updater:
    class: Drupal\geoapify_importer\Service\Poi\PoiNodeUpdater
    arguments: ['@entity_type.manager', '@geoapify_importer.coordinate_transformer', '@datetime.time', '@logger.channel.geoapify_importer']

  geoapify_importer.place_info:
    class: Drupal\geoapify_importer\Service\PlaceInfo
    arguments: ['@entity_type.manager']

  geoapify_importer.town_queue_manager:
    class: Drupal\geoapify_importer\Service\TownQueueManager
    arguments: ['@queue', '@keyvalue', '@entity_type.manager', '@geoapify_importer.town_import_runner', '@geoapify_importer.rate_limiter', '@config.factory', '@datetime.time', '@logger.channel.geoapify_importer']

  Drupal\geoapify_importer\Hook\GeoapifyImporterHooks:
    class: Drupal\geoapify_importer\Hook\GeoapifyImporterHooks
    arguments: ['@geoapify_importer.town_queue_manager', '@logger.channel.geoapify_importer']

  geoapify_importer.unmapped_category_report:
    class: Drupal\geoapify_importer\Service\Poi\UnmappedCategoryReport
    arguments: ['@geoapify_importer.source_writer', '@geoapify_importer.poi_category_classifier', '@geoapify_importer.poi_category_mapper']

  geoapify_importer.poi_category_tagger:
    class: Drupal\geoapify_importer\Service\Poi\PoiCategoryTagger
    arguments: ['@entity_type.manager']

  logger.channel.geoapify_importer:
    parent: logger.channel_base
    arguments: ['geoapify_importer']
